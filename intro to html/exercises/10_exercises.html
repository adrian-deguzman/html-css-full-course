<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10. Nested Layouts Technique Exercises</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="10_exercises.css" />
  </head>
  <body>
    <p>10a. Draw the layout for this design</p>
    <div class="user-card">
      <div class="user-card__profile">
        <img
          src="images/cute-cat.jpg"
          alt="Barbieque the cat"
          class="user-card__profile-picture"
        />
      </div>
      <div class="user-card__details">
        <div class="user-card__name">Barbique</div>
        <div class="user-card__bio">the chute cat</div>
        <div class="user-card__badge">Popular</div>
      </div>
      <div class="user-card__action">
        <button class="user-card__follow-button">Follow</button>
      </div>
    </div>
  </body>
